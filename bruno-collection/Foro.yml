opencollection: 1.0.0
info:
  name: Foro
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ''
      port: ''
      auth:
        username: ''
        password: ''
      bypassProxy: ''
items:
  - info:
      name: Registro
      type: http
      seq: 1
    http:
      method: POST
      url: http://localhost:8081/api/auth/register
      body:
        type: json
        data: |-
          {
            "username": "usuario_cloud",
            "email": "usuario@foro.cl",
            "password": "Clave*1234",
            "role": "ROLE_USER"
          }
      auth: inherit
    settings:
      encodeUrl: true
      timeout: 0
      followRedirects: true
      maxRedirects: 5
      forwardAuthorizationHeader: false
  - info:
      name: categorias
      type: http
      seq: 2
    http:
      method: GET
      url: http://localhost:8082/api/forum/categories
      auth: inherit
    settings:
      encodeUrl: true
      timeout: 0
      followRedirects: true
      maxRedirects: 5
      forwardAuthorizationHeader: false
  - info:
      name: tema en el foro
      type: http
      seq: 3
    http:
      method: POST
      url: http://localhost:8082/api/forum/posts
      body:
        type: json
        data: |-
          {
            "title": "Duda sobre Spring Boot y Oracle Wallet",
            "content": "Logre conectar ambos microservicios a Oracle Cloud usando ojdbc11-production.",
            "authorUsername": "usuario_cloud",
            "categoryId": 1
          }
      auth: inherit
    settings:
      encodeUrl: true
      timeout: 0
      followRedirects: true
      maxRedirects: 5
      forwardAuthorizationHeader: false
  - info:
      name: Listar todos los temas activos
      type: http
      seq: 4
    http:
      method: GET
      url: http://localhost:8082/api/forum/posts
      auth: inherit
    settings:
      encodeUrl: true
      timeout: 0
      followRedirects: true
      maxRedirects: 5
      forwardAuthorizationHeader: false
  - info:
      name: Filtrar por categoría
      type: http
      seq: 5
    http:
      method: GET
      url: http://localhost:8082/api/forum/posts?categoryId=1
      params:
        - name: categoryId
          value: '1'
          type: query
      auth: inherit
    settings:
      encodeUrl: true
      timeout: 0
      followRedirects: true
      maxRedirects: 5
      forwardAuthorizationHeader: false
  - info:
      name: Banear / Desbanear una publicación
      type: http
      seq: 6
    http:
      method: PATCH
      url: http://localhost:8082/api/forum/admin/posts/1/ban
      auth: inherit
    settings:
      encodeUrl: true
      timeout: 0
      followRedirects: true
      maxRedirects: 5
      forwardAuthorizationHeader: false
bundled: true
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
    exportedAt: '2026-11-24T02:05:55.419Z'
    exportedUsing: Bruno
